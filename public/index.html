<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traductor de Código Morse</title>
</head>
<body>

  <div class="main-container">
    
    <!-- Encabezado -->
    <header class="text-center mb-4">
      <h1 class="page-title">Traductor de Código Morse</h1>
      <p class="page-subtitle">Conversor simple entre texto y código morse</p>
    </header>

    <!-- Barra de modo -->
    <div class="mode-bar">
      <div class="mode-title">
        <span id="sourceModeLabel">Texto</span>
        <span class="text-muted mx-2">→</span>
        <span id="targetModeLabel">Morse</span>
      </div>
      <button id="btnToggleMode" class="btn-switch" type="button">Invertir (⇄)</button>
    </div>

    <!-- Campos de entrada y salida -->
    <div class="row g-3">
      
      <!-- Entrada -->
      <div class="col-md-6">
        <div class="box-card">
          <div class="box-header">
            <span id="inputCardTitle">Texto</span>
            <div class="d-flex align-items-center gap-2">
              <span id="charCountBadge" class="text-muted small">0 caracteres</span>
              <button id="btnClear" class="btn-action" type="button">Limpiar</button>
            </div>
          </div>
          <textarea 
            id="inputText" 
            class="form-control textarea-field" 
            placeholder="Escribe el texto aquí..."
            spellcheck="false"
          ></textarea>

          <div id="morseKeypad" class="morse-buttons d-none">
            <button type="button" class="btn-key" data-key=".">Punto (.)</button>
            <button type="button" class="btn-key" data-key="-">Raya (-)</button>
            <button type="button" class="btn-key" data-key=" ">Espacio</button>
            <button type="button" class="btn-key" data-key=" / ">Palabra ( / )</button>
          </div>
        </div>
      </div>

      <!-- Salida -->
      <div class="col-md-6">
        <div class="box-card">
          <div class="box-header">
            <span id="outputCardTitle">Morse</span>
            <button id="btnCopy" class="btn-action" type="button">Copiar</button>
          </div>
          <textarea 
            id="outputText" 
            class="form-control textarea-field font-monospace" 
            placeholder="La traducción aparecerá aquí..." 
            readonly
          ></textarea>
        </div>
      </div>

    </div>

    <!-- Mensaje de validación -->
    <div id="validationFeedback" class="d-none"></div>

    <!-- Referencia Morse -->
    <div class="reference-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="reference-title">Tabla de Referencia</span>
        <button class="btn-action" type="button" data-bs-toggle="collapse" data-bs-target="#refTable">
          Mostrar / Ocultar
        </button>
      </div>

      <div class="collapse show" id="refTable">
        <div class="text-muted small fw-semibold my-2" style="font-size: 0.75rem;">ALFABETO (A - Z, Ñ)</div>
        <div id="lettersContainer" class="morse-grid mb-2"></div>

        <div class="text-muted small fw-semibold my-2" style="font-size: 0.75rem;">NÚMEROS (0 - 9)</div>
        <div id="numbersContainer" class="morse-grid mb-2"></div>

        <div class="text-muted small fw-semibold my-2" style="font-size: 0.75rem;">SIGNOS</div>
        <div id="symbolsContainer" class="morse-grid"></div>
      </div>
    </div>

  </div>

  <!-- Toast de copiado -->
  <div id="copyToast" class="toast-msg">Copiado</div>

</body>
</html>
